# Maxx agent — coding V1 sources (more stacks in v2)
# See SOURCES_ROADMAP.md for LeetCode, Exercism, GitHub, Stack Overflow dump

fetch_urls: true

local_paths:
  - coding/docs
  - coding/devdocs   # DevDocs offline exports (recommended for devdocs.io)

# V1 DevDocs hubs (offline packs) — no php / cpp / csharp
devdocs_languages:
  - python
  - javascript
  - typescript
  - node
  - java
  - c
  - go
  - rust
  - ruby
  - swift
  - kotlin
  - sql
  - bash
  - docker
  - git

urls:
  # DevDocs entry points (use offline export for real text; URLs for catalog)
  - https://devdocs.io/python/
  - https://devdocs.io/javascript/
  - https://devdocs.io/typescript/
  - https://devdocs.io/node/
  - https://devdocs.io/java/
  - https://devdocs.io/c/
  - https://devdocs.io/go/
  - https://devdocs.io/rust/
  - https://devdocs.io/ruby/
  - https://devdocs.io/swift/
  - https://devdocs.io/kotlin/
  - https://devdocs.io/sql/
  - https://devdocs.io/bash/
  - https://devdocs.io/docker/
  - https://devdocs.io/git/

  # Node.js (official — works with plain fetch)
  - https://nodejs.org/en/docs/guides/getting-started-guide
  - https://nodejs.org/api/

  # Next.js
  - https://nextjs.org/docs
  - https://nextjs.org/docs/app/building-your-application/routing
  - https://nextjs.org/docs/app/building-your-application/data-fetching

  # Docker
  - https://docs.docker.com/get-started/
  - https://docs.docker.com/guides/

  # FastAPI
  - https://fastapi.tiangolo.com/
  - https://fastapi.tiangolo.com/tutorial/
  - https://fastapi.tiangolo.com/tutorial/first-steps/

  # Git
  - https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control
  - https://git-scm.com/docs/git-commit

  # MDN — web (JS/TS/Next ecosystem)
  - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide
  - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference
  - https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API

  # Python official
  - https://docs.python.org/3/tutorial/introduction.html
  - https://docs.python.org/3/tutorial/controlflow.html
  - https://docs.python.org/3/tutorial/classes.html
  - https://docs.python.org/3/tutorial/errors.html
  - https://docs.python.org/3/library/functions.html

allowed_domains:
  - devdocs.io
  - developer.mozilla.org
  - docs.python.org
  - nodejs.org
  - nextjs.org
  - docs.docker.com
  - fastapi.tiangolo.com
  - git-scm.com

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxx-agent"
version = "0.1.0"
description = "Maxx agent runtime: RAG, tools, memory, public dataset loaders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "datasets>=2.19.0",
    "huggingface_hub>=0.23.0",
]

[project.scripts]
maxx-agent = "maxx_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["maxx_agent*"]

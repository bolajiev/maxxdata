[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxxdata"
version = "0.1.0"
description = "Agent dataset pipeline: ingest, clean, validate, label, serve"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "trafilatura>=1.12.0",
    "langdetect>=1.0.9",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "openai>=1.40.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "simhash>=2.1.2",
]

[project.scripts]
maxxdata = "maxxdata.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["maxxdata*"]
